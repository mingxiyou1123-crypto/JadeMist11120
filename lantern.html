<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>放莲 · 莲间</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#0e1a15}body{margin:0;min-height:100vh;color:#f1f0e8;font:15px/1.8 'Noto Serif SC','Songti SC',serif;background:linear-gradient(#08130fc9,#08130f9e),url('pond-water.svg') center/cover fixed}.top{height:72px;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(20px,7vw,100px);background:#0b1713b8;border-bottom:1px solid #fff2}.top a{color:inherit;text-decoration:none;letter-spacing:.14em}.brand{font-size:18px}.wrap{width:min(1100px,92vw);margin:auto;padding:40px 0 60px;text-align:center}.eyebrow{color:#dccba5;letter-spacing:.32em;font-size:11px}.title{font-weight:400;font-size:clamp(34px,5vw,54px);letter-spacing:.2em;margin:10px 0}.intro{color:#d7dfd7;margin:0}.pond{position:relative;height:min(62vh,590px);min-height:420px;margin:30px auto 20px;overflow:hidden;border:1px solid #e8eee63a;background:linear-gradient(#0a18104a,#08150c55),url('pond-water.svg') center/cover;box-shadow:0 24px 75px #0008}.pond:after{content:'';position:absolute;left:0;right:0;bottom:12%;height:12%;background:radial-gradient(ellipse, #d8e2d922,transparent 70%);filter:blur(10px)}.water-ripple{position:absolute;left:50%;bottom:20%;width:min(58%,640px);height:60px;transform:translateX(-50%);border-top:1px solid #e6ede52f;border-radius:50%;filter:blur(1px)}.lamp{position:absolute;z-index:2;width:clamp(76px,10vw,112px);height:88px;transform:translate(-50%,-50%);border:0;background:none;padding:4px;cursor:pointer;filter:drop-shadow(0 0 11px #fff7);transition:filter .3s,transform .3s;animation:drift 5s ease-in-out infinite}.lamp img{width:100%;height:100%;object-fit:contain}.lamp:hover,.lamp:focus-visible{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #fff5bd);transform:translate(-50%,-54%) scale(1.06);outline:none}.lamp:after{content:'';position:absolute;inset:12px 9px;border-radius:50%;box-shadow:0 0 14px 4px #fff8c833;pointer-events:none}@keyframes drift{50%{margin-top:-6px}}.composer{width:min(580px,100%);margin:22px auto 0;padding:20px;background:#0a1711dd;border:1px solid #e3d9bd44;text-align:left}.composer label{display:block;margin-bottom:8px;letter-spacing:.12em}.composer textarea{width:100%;min-height:84px;resize:vertical;padding:12px;background:#ffffff0d;border:1px solid #ffffff44;color:#fff;font:inherit}.composer textarea::placeholder{color:#bfcabe}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px}.btn{padding:11px 22px;color:#fff;background:#142820;border:1px solid #c5b68f;font:inherit;letter-spacing:.12em;cursor:pointer}.btn:hover{background:#334d3e}.caption{color:#c7d0c7;font-size:12px;margin-top:16px}.modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:20px;background:#07110ee8}.modal.open{display:flex}.card{position:relative;width:min(460px,100%);padding:34px 28px;background:#14251d;border:1px solid #dbcca47a;box-shadow:0 24px 80px #0009}.card h2{font-weight:400;letter-spacing:.16em;margin:0 30px 18px}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.close{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:25px;cursor:pointer}.empty{color:#cfdbd0}@media(max-width:600px){.top{height:62px}.wrap{padding-top:30px}.pond{height:62vh;min-height:390px}.title{font-size:36px}.composer{padding:17px 14px}}
</style></head><body><header class="top"><a class="brand" href="index.html">莲间 · 一池清欢</a><a href="index.html#fang">回到首页</a></header><main class="wrap"><span class="eyebrow">A WISH UPON THE WATER</span><h1 class="title">放莲</h1><p class="intro">写下一份心愿，让一盏白莲灯轻轻漂入池中。</p><section class="pond" id="pond" aria-label="静水莲池"><span class="water-ripple"></span></section><form class="composer" id="wish-form"><label for="wish">把心愿写在莲灯上</label><textarea id="wish" maxlength="100" placeholder="此刻，你想许下什么心愿？最多 100 字" required></textarea><div class="actions"><button class="btn" type="submit">点亮并放入莲池</button><a class="btn" href="seed.html">去种莲</a></div></form><p class="caption">点击池中的白莲，可以再次看见写下的心愿。</p></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><article class="card"><button class="close" id="close" aria-label="关闭">×</button><h2 id="modal-title">莲灯心愿</h2><p id="wish-text"></p><div class="actions"><button class="btn" id="modal-ok">收好这份心愿</button></div></article></div><script>
(()=>{const key='lotusWishes',pond=document.querySelector('#pond'),form=document.querySelector('#wish-form'),input=document.querySelector('#wish'),modal=document.querySelector('#modal'),wishText=document.querySelector('#wish-text');let wishes=[];try{wishes=JSON.parse(localStorage.getItem(key)||'[]')}catch{}function showWish(text){wishText.textContent=text;modal.classList.add('open')}function draw(){pond.querySelectorAll('.lamp').forEach(x=>x.remove());wishes.forEach((w,i)=>{const lamp=document.createElement('button');lamp.className='lamp';lamp.type='button';lamp.style.left=(12+((i*29+18)%76))+'%';lamp.style.top=(22+((i*37+30)%60))+'%';lamp.setAttribute('aria-label','查看莲灯心愿');const image=document.createElement('img');image.src='images/lotus-cutout-white.png';image.alt='';lamp.append(image);lamp.addEventListener('click',()=>showWish(w.text));pond.append(lamp)})}draw();form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;wishes.push({text,date:Date.now()});try{localStorage.setItem(key,JSON.stringify(wishes))}catch{}draw();input.value='';document.querySelector('.caption').textContent='莲灯已放入池中，点击白莲查看心愿。'});function close(){modal.classList.remove('open')}document.querySelector('#close').onclick=close;document.querySelector('#modal-ok').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})})();
</script></body></html>
