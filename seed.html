<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>种莲 · 莲间</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#0e1a15}body{margin:0;min-height:100vh;color:#f1f0e8;font:15px/1.8 'Noto Serif SC','Songti SC',serif;background:linear-gradient(#08130fc9,#08130f9e),url('pond-water.svg') center/cover fixed}.top{height:72px;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(20px,7vw,100px);background:#0b1713b8;border-bottom:1px solid #fff2}.top a{color:inherit;text-decoration:none;letter-spacing:.14em}.brand{font-size:18px}.wrap{width:min(1100px,92vw);margin:auto;padding:40px 0 60px;text-align:center}.eyebrow{color:#dccba5;letter-spacing:.32em;font-size:11px}.title{font-weight:400;font-size:clamp(34px,5vw,54px);letter-spacing:.2em;margin:10px 0}.intro{color:#d7dfd7;margin:0}.pond{position:relative;height:min(62vh,590px);min-height:420px;margin:30px auto 20px;overflow:hidden;border:1px solid #e8eee63a;background:linear-gradient(#0a18104a,#08150c55),url('pond-water.svg') center/cover;box-shadow:0 24px 75px #0008}.pond:after{content:'';position:absolute;left:0;right:0;bottom:12%;height:12%;background:radial-gradient(ellipse, #d8e2d922,transparent 70%);filter:blur(10px)}.water-ripple{position:absolute;left:50%;bottom:20%;width:min(58%,640px);height:60px;transform:translateX(-50%);border-top:1px solid #e6ede52f;border-radius:50%;filter:blur(1px)}.bud-wrap{position:absolute;left:50%;top:52%;height:180px;width:100px;transform:translate(-50%,-50%);display:none;z-index:2}.bud-wrap.show{display:block}.stem{position:absolute;left:49px;top:90px;width:3px;height:105px;background:linear-gradient(90deg,#778e72,#a8b494,#536a52);transform:rotate(-2deg);transform-origin:top;border-radius:4px}.bud{position:absolute;z-index:2;left:23px;top:15px;width:56px;height:91px;filter:drop-shadow(0 0 12px #fff8)}.bud:before{content:'';position:absolute;inset:3px 7px 8px;background:linear-gradient(90deg,#c5d3c6,#f4f1e4 48%,#d1ddce);clip-path:polygon(50% 0,87% 34%,93% 78%,72% 100%,28% 100%,7% 78%,13% 34%);border-radius:50% 50% 46% 46%}.bud:after{content:'';position:absolute;left:25px;top:20px;width:8px;height:54px;border-left:1px solid #9baa96;transform:rotate(-7deg);opacity:.8}.caption{display:inline-block;min-width:min(370px,90%);padding:10px 18px;background:#0a1711bd;border:1px solid #e7dfc24c}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.btn{padding:12px 24px;color:#fff;background:#142820;border:1px solid #c5b68f;font:inherit;letter-spacing:.13em;cursor:pointer}.btn:hover{background:#334d3e}.note{font-size:12px;color:#c6cec5;margin-top:18px}@media(max-width:600px){.top{height:62px}.wrap{padding-top:30px}.pond{height:62vh;min-height:390px}.title{font-size:36px}}
</style></head><body><header class="top"><a class="brand" href="index.html">莲间 · 一池清欢</a><a href="index.html#zhong">回到首页</a></header><main class="wrap"><span class="eyebrow">A SEED IN STILL WATER</span><h1 class="title">种莲</h1><p class="intro">在一池静水里，为自己种下一枚莲苞。</p><section class="pond" aria-label="静水莲池"><span class="water-ripple"></span><div class="bud-wrap" id="bud"><i class="bud"></i><i class="stem"></i></div></section><div class="caption" id="caption">池水澄明，等一颗莲种落下</div><div class="actions"><button class="btn" id="plant" type="button">种下莲苞</button><a class="btn" href="lantern.html">去放莲</a></div><p class="note">莲苞的生长记录保存在当前浏览器中。</p></main><script>
(()=>{const key='lotusSeed',bud=document.querySelector('#bud'),caption=document.querySelector('#caption'),button=document.querySelector('#plant');let seed=null;try{seed=JSON.parse(localStorage.getItem(key)||'null')}catch{}function render(){if(!seed)return;bud.classList.add('show');const days=Math.max(0,Math.floor((Date.now()-seed.date)/86400000));caption.textContent=days<3?'莲苞初生 · 静候花开':days<12?'舒叶待放 · 莲苞正在生长':days<30?'含苞静候 · 每日慢慢舒展':'莲开见喜 · 花期已至';button.textContent='再种一枚莲苞'}render();button.addEventListener('click',()=>{seed={date:Date.now()};try{localStorage.setItem(key,JSON.stringify(seed))}catch{}render();caption.textContent='莲苞已种下 · 愿它日日安然';});})();
</script></body></html>
